name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cognicare, POSTGRES_PASSWORD: cognicare, POSTGRES_DB: cognicare }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cognicare" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://cognicare:cognicare@localhost:5432/cognicare
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-ci-test-secret-ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci   # postinstall builds shared + prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed   # sessions e2e logs in as the seeded demo accounts
      - run: npm run test:e2e
      - run: node --test packages/shared/test/*.test.mjs
      - run: npm run build -w apps/web
